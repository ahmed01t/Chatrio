# Alembic Database Migration Configuration for Chatrio

[alembic]
# Path to directory containing migration scripts
script_location = migrations

# Template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# Add backend directory to Python sys.path so alembic can import `app`
prepend_sys_path = .

# Use UTC timestamps for migration generation
timezone = UTC

# Maximum length of the slug in generated filenames
truncate_slug_length = 40

# Run environment during revision command to enable autogenerate
revision_environment = true

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
